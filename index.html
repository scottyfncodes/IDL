<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>idl — a pocket of play</title>
    <meta name="description" content="idl is a free pocket of play for the time in between: six original daily puzzles and a room of offline games, including games for two people sharing one phone." />
    <meta name="theme-color" content="#f5efe3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141a17" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="idl" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/favicon-64.png" type="image/png" sizes="64x64" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta property="og:title" content="idl — a pocket of play" />
    <meta property="og:description" content="Free daily puzzles and offline games. No account, no ads." />
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      (function () {
        try {
          var raw = localStorage.getItem('idl:settings');
          var pref = raw ? JSON.parse(raw).data.theme : 'system';
          var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript><p style="padding:2rem;font-family:sans-serif">idl needs JavaScript to run its games.</p></noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
